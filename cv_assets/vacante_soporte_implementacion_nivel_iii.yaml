perfil: |
  Ingeniero de Sistemas y Especialista en Seguridad Informática con más de cuatro
  años de experiencia en soporte tecnológico, implementación de soluciones,
  administración de infraestructura y gestión de incidentes. Cuento con experiencia
  en implementación y soporte de telefonía IP Cisco, configuración de extensiones,
  troncales SIP, IVR y colas, así como atención y solución de incidentes asociados
  a comunicaciones. Complemento este conocimiento con administración de Active
  Directory, cuentas de usuario y dominio, accesos por VPN, permisos de red,
  revisión de logs, cámaras de seguridad y ejecución de copias de respaldo
  automatizadas hacia la nube mediante scripts con rclone. He implementado GLPI
  para centralizar la gestión de incidentes y construir la hoja de vida de los
  activos tecnológicos, fortaleciendo la trazabilidad del soporte. Mi experiencia
  también comprende automatización de procesos con Python, administración y
  consulta de bases de datos SQL, elaboración de macros y tableros en Power BI.
  Desde auditoría de TI he evaluado controles y soluciones de comunicaciones bajo
  COBIT, integrando una visión técnica de operación, seguridad, continuidad y
  cumplimiento. Me caracterizo por analizar incidentes con criterio, documentar
  las soluciones y acompañar su puesta en marcha hasta estabilizar la operación.

