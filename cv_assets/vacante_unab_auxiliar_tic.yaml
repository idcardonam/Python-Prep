perfil: |
  Soy Ingeniero de Sistemas con formación complementaria en Seguridad Informática y
  experiencia práctica en soporte técnico a usuarios, atención de incidentes y
  acompañamiento de la infraestructura tecnológica de organizaciones que no pueden
  detenerse. He trabajado de cerca con personas que necesitan una respuesta clara
  cuando algo no funciona: escucho con paciencia, diagnostico con método y dejo
  registro de lo que hice para que el caso no se pierda en el camino. Conozco el
  manejo de entornos Windows y Linux, el seguimiento de redes y servicios, la
  actualización de inventarios de hardware y software, y la importancia de cumplir
  las políticas de seguridad de la información en cada actividad de soporte. En mi
  trayectoria he apoyado mantenimientos preventivos, documentado cambios e
  incidentes, y escalado casos al equipo especializado cuando la situación lo
  requería. Me mueve el servicio bien hecho: resolver con calidad, comunicar con
  respeto y contribuir a que la comunidad usuaria tenga herramientas estables para
  cumplir su labor. Busco integrarme al Departamento de Tecnologías de Información
  y la Comunicación de la UNAB como Auxiliar administrativo TIC, con disposición
  para la modalidad presencial en Bucaramanga y el compromiso de aportar desde el
  primer día con actitud proactiva, orden y sentido de responsabilidad.

