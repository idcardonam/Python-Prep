  logs, cámaras de seguridad y respaldos automatizados hacia la nube mediante
  scripts con rclone. He implementado GLPI para centralizar incidentes, solicitudes
  e inventario de activos, mejorando la trazabilidad del soporte. Complemento mi
  perfil con automatización de procesos en Python, dominio de SQL, elaboración de
  macros y tableros en Power BI. Mi experiencia auditando controles y soluciones
  de comunicaciones bajo COBIT me permite integrar operación, seguridad,
  continuidad y cumplimiento, con criterio para diagnosticar incidentes, documentar
  soluciones y acompañar cada implementación hasta estabilizar el servicio.

