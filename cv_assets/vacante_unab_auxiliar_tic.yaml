perfil: |
  Ingeniero de Sistemas y Especialista en Seguridad Informática con experiencia
  comprobada en soporte técnico, administración de infraestructura TIC y gestión
  de incidentes en entornos corporativos de alta exigencia operativa. Integro la
  atención de primer nivel a usuarios, el diagnóstico de fallas en redes y
  servicios, la documentación de solicitudes y el cumplimiento de políticas de
  seguridad de la información. Cuento con sólida trayectoria en el mantenimiento
  de plataformas, la administración de bases de datos SQL, la actualización de
  inventarios de hardware y software, y el seguimiento de la continuidad de los
  servicios tecnológicos. Domino entornos Windows y Linux, herramientas de
  análisis de datos, automatización de procesos y desarrollo de soluciones con
  Python, React, PHP y CSS, lo que me permite aportar en la resolución de
  incidentes, la integración de sistemas y la mejora de la operación diaria. Mi
  formación y experiencia en auditoría TIC, junto con conocimientos en ISO 27001,
  COBIT, NIST, ITIL y GDPR, fortalecen mi criterio para ejecutar soporte con
  orientación al servicio, trazabilidad y rigor técnico, entregando intervenciones
  oportunas, documentadas y alineadas a las necesidades de organizaciones que
  requieren estabilidad, control y confiabilidad en su ecosistema digital.

