perfil: |
  Ingeniero de Sistemas y Especialista en Seguridad Informática, con más de cinco años
  de experiencia en entornos donde la tecnología debe funcionar todos los días, para
  todas las personas. Mi trabajo ha estado en ese punto clave donde el usuario necesita
  ayuda y el área de sistemas necesita orden: atender con calma, resolver con criterio
  y dejar cada caso documentado para que la información no se pierda en el camino.
  He prestado soporte técnico de primer nivel, diagnosticado fallos en plataformas y
  servicios, apoyado tareas de mantenimiento preventivo y acompañado la operación de
  entornos Windows y Linux. Entiendo que en una universidad el soporte TIC no se nota
  cuando todo marcha bien, pero se agradece cuando alguien responde con claridad,
  trato respetuoso y soluciones oportunas. Por eso priorizo la comunicación con el
  usuario, el seguimiento de incidentes y el cumplimiento de las políticas de seguridad
  de la información en cada intervención. Cuento con certificación en ISO/IEC 27001:2022
  y experiencia en organizaciones que exigen trazabilidad, continuidad del servicio y
  trabajo en equipo. Me postulo al cargo de Auxiliar administrativo TIC de la UNAB con
  genuino interés en aportar al Departamento de Tecnologías de Información y la
  Comunicación, en modalidad presencial en Bucaramanga, con actitud proactiva y
  compromiso real con la comunidad universitaria.

