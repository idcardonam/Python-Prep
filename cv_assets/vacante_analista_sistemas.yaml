perfil: |
  Soy Ingeniero de Sistemas con trayectoria sólida en desarrollo de aplicaciones,
  soporte de plataformas web y administración de entornos tecnológicos. A lo largo
  de mi carrera he pasado por el ciclo completo de un sistema: lo diseño, lo construyo,
  lo pongo en marcha, le doy mantenimiento y, cuando algo falla, me quedo hasta
  dejarlo funcionando. Trabajo con Python, React, PHP, SQL y CSS; me desenvuelvo con
  naturalidad en bases de datos, integraciones entre sistemas y pruebas de software
  antes de cualquier despliegue. He operado en entornos Windows y Linux, automatizado
  procesos que antes consumían horas del equipo y participado en mejoras tecnológicas
  con impacto directo en la operación diaria. Me gusta entender el problema antes de
  proponer la solución: escucho al usuario, analizo con calma y comunico lo que encuentro
  sin complicar las cosas. Soy orientado al servicio, acostumbrado al trabajo en equipo
  y con la disciplina de documentar lo que hago para que otros puedan darle continuidad.
  Busco un rol de Analista de Sistemas donde pueda seguir aportando en desarrollo,
  soporte e innovación con soluciones prácticas, estables y bien pensadas.

